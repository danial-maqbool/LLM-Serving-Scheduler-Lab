name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduler-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,analysis]"
      - name: Tests
        run: python -m pytest -q
      - name: Baseline smoke experiment
        run: python scripts/run_experiment.py --config configs/baseline.json --output results/smoke.csv
      - name: Suite smoke and resumable cache
        shell: bash
        run: |
          python -m llm_scheduler_lab run --config configs/smoke.json --output results/ci-smoke
          python -m llm_scheduler_lab run --config configs/smoke.json --output results/ci-smoke
          python -m llm_scheduler_lab summarize --results results/ci-smoke --output results/ci-smoke/statistics
          python -m llm_scheduler_lab plot --results results/ci-smoke --output results/ci-smoke/figures
          python scripts/check_artifacts.py results/ci-smoke
          python scripts/check_links.py
  cleanup-merged-setup-branches:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the four authorized, fully merged setup branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for branch in bootstrap bootstrap-2 starter-backup starter-build; do
            ref="$(git ls-remote --heads origin "refs/heads/$branch")"
            if [ -z "$ref" ]; then continue; fi
            sha="${ref%%$'\t'*}"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if git merge-base --is-ancestor "$sha" origin/main; then
              git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
            else
              echo "Preserving $branch: it contains unmerged work."
              exit 1
            fi
          done
